{% extends 'mini_insta/base.html' %}

{% block content %}
<h1>Delete Post</h1>

<p>Are you sure you want to delete this post?</p>

<div>
    <p><strong>{{ post.profile.display_name }}</strong>: {{ post.caption }}</p>
    <small>{{ post.timestamp|date:"F j, Y g:i A" }}</small>
</div>

<br>

<form action="{% url 'delete_post' post.pk %}" method="POST" style="display:inline;">
    {% csrf_token %}
    <input type="submit" value="Confirm Delete">
</form>

<form action="{% url 'show_profile' profile.pk %}" method="GET" style="display:inline;">
    <input type="submit" value="Cancel">
</form>
{% endblock %}

{% extends 'mini_insta/base.html' %}

{% block content %}

{% if request.user.is_authenticated %}

<h1>Create a New Post</h1>

<form action="{% url 'create_post' profile.pk %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <table>
        {{ form.as_table }}
        <tr>
            <td><label for="files">Upload Images:</label></td>
            <td><input type="file" name="files" id="files" multiple></td>
        </tr>
    </table>

    <input type="submit" value="Submit">
    <a href="{% url 'show_profile' profile.pk %}">
        <button type="button">Cancel</button>
    </a>
</form>

<p>You must be logged in to create a post</p>
<li><a href="{% url 'login' %}">Login</a></li>
{% endif %}

{% endblock %}

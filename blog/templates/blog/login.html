{% extends 'blog/base.html' %}
 
{% block content %}

<h1>Login</h1>
<form method="post" action="{% url 'login' %}" >
    {% csrf_token %}
    {{form}}

    {% if request.GET.next %}
    <input type="hidden" name="next" value="{{request.GET.next}}">
    {% else %}
    <input type="hidden" name="next" value="{% url 'show_all' %}">
    {% endif %}
</form>
 
<hr>
<a href="{% url 'register' %}">Register here</a>.
{% endblock %}

{% extends 'mini_insta/base.html' %}

{% block content %}
<h1>Search</h1>

<form action="{% url 'search' profile.pk %}" method="GET">
    <label for="query">Search for profiles or posts:</label><br>
    <input type="text" name="query" id="query" placeholder="Enter search query">
    <input type="submit" value="Search">
</form>
{% endblock %}

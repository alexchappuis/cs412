{% extends 'blog/base.html' %}

{% block content %}
<h2>Add a comment about {{ article }}</h2>

<form method="POST">
  {% csrf_token %}
  <table>
    {% for field in form %}
      <tr>
        <th>{{ field.label }}</th>
        <td>{{ field }}</td>
      </tr>
    {% endfor %}
    <tr>
      <td></td>
      <td><input type="submit" value="Add Comment!"></td>
    </tr>
  </table>
</form>

{% endblock %}

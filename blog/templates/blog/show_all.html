{% extends 'blog/base.html' %}

{% block content %}
<main class="grid-container">

  {% for a in articles %}
    <article>
      {% if a.image_file %}
        <a href="{% url 'article' a.pk %}">
          <img src="{{ a.image_file.url }}" alt="{{ a.title }}">
        </a>
      {% endif %}

      <div>
        <h2><a href="{% url 'article' a.pk %}">{{ a.title }}</a></h2>
        <strong>by {{ a.author }} at {{ a.published }}</strong>
        <p>{{ a.text }}</p>
      </div>
    </article>
  {% empty %}
    <p>No articles yet.</p>
  {% endfor %}

</main>
{% endblock %}

{% extends 'mini_insta/base.html' %}

{% block content %}
<h1>Post by {{ post.profile.display_name }}</h1>
<p><em>{{ post.timestamp }}</em></p>
<p>{{ post.caption }}</p>

<div style="display: flex; flex-wrap: wrap; gap: 10px;">
    {% for photo in post.get_all_photos %}
        <img src="{{ photo.image_url }}" alt="Post photo" style="max-width: 400px;">
    {% empty %}
        <img src="https://via.placeholder.com/400x300?text=No+Image" alt="No image available">
    {% endfor %}
</div>

<a href="{% url 'show_profile' post.profile.pk %}">← Back to Profile</a>
{% endblock %}

{% extends 'mini_insta/base.html' %}

{% block content %}
<h1>Followers of {{ profile.display_name }}</h1>

<ul>
{% for follower in profile.get_followers %}
  <li>
    <a href="{% url 'show_profile' follower.pk %}">{{ follower.display_name }}</a>
    (@{{ follower.username }})
  </li>

{% endfor %}
</ul>

<p><a href="{% url 'show_profile' profile.pk %}">Back to {{ profile.display_name }}'s Profile</a></p>
{% endblock %}

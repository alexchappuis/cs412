{% extends "mini_insta/base.html" %}

{% block content %}
<h1>All Profiles</h1>

<section class="grid-container">
{% for p in profiles %}

  <article>
    {% if p.image_file %}
      <a href="{% url 'show_profile' p.pk %}">
        <img src="{{ p.image_file.url }}" alt="{{ p.display_name }}">
      </a>
    {% elif p.profile_image_url %}
      <a href="{% url 'show_profile' p.pk %}">
        <img src="{{ p.profile_image_url }}" alt="{{ p.display_name }}">
      </a>
    {% endif %}

    <h3><a href="{% url 'show_profile' p.pk %}">{{ p.display_name }}</a></h3>
    <p>@{{ p.username }}</p>
    <p>Joined: {{ p.join_date|date:"F j, Y" }}</p>
    <p>{{ p.bio_text }}</p>
  </article>

{% endfor %}
</section>

{% endblock %}
